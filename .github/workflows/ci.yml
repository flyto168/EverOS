name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrity check
        run: |
          set -e
          if [ -f README.md ]; then echo README-ok; fi
          find . -path ./.git -prune -o -type f -name '*.sh' -print | while read -r s; do bash -n "$s"; done || true
          find . -path ./.git -prune -o -type f -name '*.py' -print | while read -r s; do python3 -m py_compile "$s" || exit 1; done
          echo SMOKE-PASS
